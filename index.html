  .cctv {

function parseRoom(raw) {

  const building = Number(match[1]);
  const rest = match[2];

  let floor;
  let room;
  if (building <= 8) {
    if (rest.length !== 3) return null;
    floor = Number(rest.charAt(0));
    room = Number(rest.slice(1));
    if (floor < 1 || floor > 5 || room < 1 || room > 10) return null;
  } else if (rest.length === 4) {
    if (rest.slice(0, 2) !== '10') return null;
    floor = 10;
    room = Number(rest.slice(2));
    if (room < 1 || room > 20) return null;
  } else if (rest.length === 3) {
    floor = Number(rest.charAt(0));
    room = Number(rest.slice(1));
    if (floor < 1 || floor > 9 || room < 1 || room > 20) return null;

function roomParts(value) {

  const parsed = parseRoom(raw);
  if (parsed) return { building: parsed.building, floorRoom: parsed.canonical.slice(parsed.building.length + 1) };
  const cut = raw.indexOf('-');
  if (cut < 0) return { building: raw.replace(/\D/g, '').slice(0, 2), floorRoom: '' };
  return { building: raw.slice(0, cut).replace(/\D/g, '').slice(0, 2), floorRoom: raw.slice(cut + 1).replace(/\D/g, '').slice(0, 4) };

function roomFromForm(fd) {

  const floorRoom = String(fd.get('floorRoom') || '').replace(/\D/g, '');
  if (!building && !floorRoom && fd.get('room')) return parseRoom(fd.get('room'));
  return parseRoom(building + '-' + floorRoom);
}
function roomLiveError(building, floorRoom) {
  const b = String(building || '').replace(/\D/g, '');
  const f = String(floorRoom || '').replace(/\D/g, '');
  if (!b && !f) return '';
  if (b && (!/^\d{1,2}$/.test(b) || Number(b) < 1 || Number(b) > 12)) return roomError();
  if (!f || !b) return '';
  if (f.charAt(0) === '0') return roomError();
  const n = Number(b);
  if (n <= 8 && Number(f.charAt(0)) > 5) return roomError();
  if (n <= 8 && f.length < 3) return '';
  if (n >= 9 && f.length < 3) return '';
  return parseRoom(b + '-' + f) ? '' : roomError();
}

function sensorNode(id) {
  return SENSOR_NODES.find(function (n) { return n.id === id; });
}
function blankSensor(node, now) {
  return {
    id: node.id,
    lat: node.lat,
    lng: node.lng,
    road: bi(node.th, node.en, 'th'),
    status: node.leak ? 'leak' : 'safe',
    leakageMa: node.leak ? node.ma : node.ma,
    waterCm: node.water,
    updatedAt: now - node.age * 60000
  };
}
function ensureSensors(data) {
  const now = Date.now();
  const prev = {};
  (data.sensors || []).forEach(function (s) { if (s && s.id) prev[s.id] = s; });
  data.sensors = SENSOR_NODES.map(function (node) {
    const row = blankSensor(node, now);
    const old = prev[node.id];
    if (!old) return row;
    row.status = old.status === 'leak' ? 'leak' : 'safe';
    const ma = Number(old.leakageMa);
    const water = Number(old.waterCm);
    if (isFinite(ma)) row.leakageMa = ma;
    if (isFinite(water)) row.waterCm = water;
    if (old.updatedAt) row.updatedAt = old.updatedAt;
    if (row.status === 'safe' && row.leakageMa >= 5) row.leakageMa = 0;
    if (row.status === 'leak' && row.leakageMa < 5) row.leakageMa = node.ma || 48.5;
    return row;
  });
}

function toggleSensor(id) {
  if (!isAdmin()) return;
  state.session.selectedSensor = id;
  state.session.keepScroll = true;
  mutate(function (data) {
    const s = findById(data.sensors, id);
    if (!s) return;
    if (s.status === 'leak') {
      s.status = 'safe';
      s.leakageMa = 0;
      s.waterCm = 0;
    } else {
      s.status = 'leak';
      s.leakageMa = 48.5;
      s.waterCm = 20;
    }
    s.updatedAt = Date.now();
  });
}
function simulateSensorScan() {
  if (!isAdmin()) return;
  const prone = ['SENSOR-KMITL-07', 'SENSOR-KMITL-09', 'SENSOR-KMITL-12', 'SENSOR-KMITL-14', 'SENSOR-KMITL-19', 'SENSOR-KMITL-20'];
  state.session.keepScroll = true;
  mutate(function (data) {
    data.sensors.forEach(function (s) {
      if (s.status === 'leak') {
        s.leakageMa = Math.round((30 + Math.random() * 35) * 10) / 10;
        s.waterCm = Math.round(8 + Math.random() * 28);
      } else {
        s.leakageMa = Math.round(Math.random() * 4) / 10;
        s.waterCm = Math.random() < 0.2 ? 1 : 0;
      }
      s.updatedAt = Date.now();
    });
    const step = (data.sensorScan || 0) + 1;
    data.sensorScan = step;
    const targetId = prone[step % prone.length];
    const target = findById(data.sensors, targetId);
    if (target) {
      if (target.status === 'leak') {
        target.status = 'safe';
        target.leakageMa = 0;
        target.waterCm = 0;
      } else {
        target.status = 'leak';
        target.leakageMa = Math.round((35 + Math.random() * 20) * 10) / 10;
        target.waterCm = 12 + Math.floor(Math.random() * 16);
      }
      target.updatedAt = Date.now();
      state.session.selectedSensor = target.id;
    }
  });
  toast('สแกนเซนเซอร์ทั้งโครงข่ายแล้ว', 'Live sensor scan complete.');
}

function normalize(data) {
  const d = data && typeof data === 'object' ? data : {};
  d.schema = 1;
  d.rev = d.rev || 0;
  d.shuttles = Array.isArray(d.shuttles) ? d.shuttles : [];
  d.foodRounds = Array.isArray(d.foodRounds) ? d.foodRounds : [];
  d.foodOrders = Array.isArray(d.foodOrders) ? d.foodOrders : [];
  d.boats = Array.isArray(d.boats) ? d.boats : [];
  d.boats.forEach(function (b) {
    b.capacity = BOAT_CAP;
    b.bookings = Array.isArray(b.bookings) ? b.bookings : [];
    if (b.status === 'maintenance') return;
    b.status = boatOccupied(b) > 0 ? 'full' : 'available';
  });
  d.pins = Array.isArray(d.pins) ? d.pins : [];
  ensureSensors(d);
  d.pins.forEach(function (p) {
    if (isFinite(Number(p.lat)) && isFinite(Number(p.lng))) {
      p.lat = Number(p.lat);
      p.lng = Number(p.lng);
      return;
    }
    const x = Number(p.x);
    const y = Number(p.y);
    if (isFinite(x) && isFinite(y)) {
      p.lat = Math.round((13.7336 - (y / 100) * 0.0074) * 1e6) / 1e6;
      p.lng = Math.round((100.7722 + (x / 100) * 0.0122) * 1e6) / 1e6;
    } else {
      p.lat = CAMPUS_LAT;
      p.lng = CAMPUS_LNG;
    }
  });
  d.leaks = Array.isArray(d.leaks) ? d.leaks : [];
  d.utilityReports = Array.isArray(d.utilityReports) ? d.utilityReports : [];
  d.news = Array.isArray(d.news) ? d.news : [];
  d.alarms = Array.isArray(d.alarms) ? d.alarms : [];
  d.alarms.forEach(function (a) {
    if (!a) return;
    if (Array.isArray(a.floors)) a.floors = a.floors.map(String);
    a.acks = Array.isArray(a.acks) ? a.acks : [];
  });
  if (d.popupRev !== 1) {
    d.alarms.forEach(function (a) {
      if (!a || a.resolved || a.kind !== 'broadcast') return;
      a.acks = a.acks.filter(function (id) { return id && id === a.authorId; });
    });
    d.popupRev = 1;
    d._popupMigrated = true;
  }
  if (!d.utility) {
    d.utility = { water: 'flowing', power: 'on', color: 'clear', note: bi('', '', 'th'), updatedAt: Date.now(), updatedBy: '' };
  }
  if (!d.waterLevel) {
    d.waterLevel = { status: 'normal', cm: 0, note: bi('', '', 'th'), streamUrl: '', updatedAt: Date.now(), updatedBy: '' };
  }
  return d;
}

/* Food rounds and menu rows disappear 24h after the scheduled deadline (or creation). */
function purgeExpired(data) {
  let expired = false;
  const now = Date.now();
  const before = data.foodRounds.length;
  data.foodRounds = data.foodRounds.filter(function (r) {
    const basis = r.deadline || r.createdAt || now;
    return now - basis < DAY;
  });
  if (data.foodRounds.length !== before) expired = true;
  data.foodRounds.forEach(function (r) {
    const n = (r.menu || []).length;
    r.menu = (r.menu || []).filter(function (m) {
      return now - (m.createdAt || r.createdAt || now) < DAY;
    });
    if (r.menu.length !== n) expired = true;
  });
  const ids = {};
  data.foodRounds.forEach(function (r) { ids[r.id] = true; });
  data.foodOrders = data.foodOrders.filter(function (o) { return ids[o.roundId]; });
  return expired;
}

function schedulePush() {
  if (!db || applyingRemote) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushRemote, 280);

async function pushRemote() {
  if (!db || applyingRemote) return;
  try {

    state.sync.error = '';

    renderChrome();

}
function toastRaw(msg) { toast(msg, msg); }

function loadFirebaseSdk() {
  if (window.firebase && firebase.firestore) return Promise.resolve();
  const urls = [
    'https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js',
    'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js',
    'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js'
  ];
  return urls.reduce(function (chain, url) {
    return chain.then(function () {
      return new Promise(function (resolve, reject) {
        const s = document.createElement('script');
        s.src = url;
        s.onload = resolve;
        s.onerror = function () { reject(new Error('Firebase SDK failed to load')); };
        document.head.appendChild(s);
      });
    });
  }, Promise.resolve());
}

async function connectFirebase(config, opts) {
  opts = opts || {};
  try {
    await loadFirebaseSdk();
    if (unsub) { unsub(); unsub = null; }
    if (firebase.apps && firebase.apps.length) await firebase.app().delete();
    firebase.initializeApp(config);
    db = firebase.firestore();
    try {
      await firebase.auth().signInAnonymously();
      state.sync.authWarning = false;
    } catch (authErr) {
      state.sync.authWarning = true;
    }
    state.local.firebaseConfig = {
      apiKey: config.apiKey,
      authDomain: config.authDomain,
      projectId: config.projectId,
      storageBucket: config.storageBucket || '',
      messagingSenderId: config.messagingSenderId || '',
      appId: config.appId
    };
    state.sync.mode = 'live';
    state.sync.error = '';
    savePref();
    unsub = db.collection('kmitlDormAlert').doc('live').onSnapshot(function (snap) {
      if (!snap.exists) {
        schedulePush();
        return;
      }
      const remote = snap.data() || {};
      if (remote.rev && remote.rev === state.data.rev) return;
      applyingRemote = true;
      state.data = normalize(remote.payload || {});
      state.data.rev = remote.rev || state.data.rev;
      const expired = purgeExpired(state.data);
      saveData();
      applyingRemote = false;
      render();
      scanAlarms();
      if (expired) schedulePush();
    }, function (err) {
      state.sync.error = err.message || String(err);
      renderChrome();
    });
    if (!opts.silent) toast('เชื่อมต่อ Firebase แล้ว ข้อมูลจะซิงก์ร่วมกัน', 'Firebase connected. Data now syncs live.');
    render();
    return true;
  } catch (err) {
    state.sync.mode = 'demo';
    state.sync.error = err.message || String(err);
    db = null;
    if (!opts.silent) toastRaw(state.sync.error);
    render();
    return false;
  }
}

async function disconnectFirebase() {
  if (unsub) { unsub(); unsub = null; }
  db = null;
  state.sync.mode = 'demo';
  state.sync.error = '';
  state.local.firebaseConfig = null;
  savePref();
  try {
    if (window.firebase && firebase.apps && firebase.apps.length) await firebase.app().delete();
  } catch (e) { /* already gone */ }
  toast('กลับสู่โหมดทดลองบนเครื่องนี้แล้ว', 'Back to on-device demo mode.');
  render();
}

function ensureAudio() {

function stopSiren() {

  clearInterval(siren.timer);

  try { siren.o2.stop(); } catch (e) { /* already stopped */ }

function startSiren() {

    if (siren) return true;
    const master = audioCtx.createGain();
    master.gain.setValueAtTime(0.62, audioCtx.currentTime);
    master.connect(audioCtx.destination);
    const o1 = audioCtx.createOscillator();
    const o2 = audioCtx.createOscillator();
    o1.type = 'square';
    o2.type = 'sawtooth';
    const g1 = audioCtx.createGain();
    const g2 = audioCtx.createGain();
    g1.gain.value = 0.7;
    g2.gain.value = 0.42;
    o1.connect(g1);
    g1.connect(master);
    o2.connect(g2);
    g2.connect(master);
    o1.start();
    o2.start();
    const timer = setInterval(function () {
      if (!siren || !audioCtx) return;
      const phase = (Date.now() % 780) / 780;
      const freq = phase < 0.5 ? 640 + phase * 2 * 900 : 1540 - (phase - 0.5) * 2 * 900;
      const t = audioCtx.currentTime;
      siren.o1.frequency.setValueAtTime(freq, t);
      siren.o2.frequency.setValueAtTime(freq * 0.5, t);

  try {
    if (!ensureAudio()) return false;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const t0 = audioCtx.currentTime + 0.02;
    o.type = 'sine';
    o.frequency.value = 784;
    g.gain.setValueAtTime(0.2, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.18);
    o.connect(g);

    o.start(t0);
    o.stop(t0 + 0.2);

    return false;

  if (!root) return;
  root.innerHTML = '<div class="live-banner" role="status"><b>' + esc(t(th, en)) + '</b><button type="button" data-act="close-banner" aria-label="' + esc(t('ปิด', 'Close')) + '">×</button></div>';
  if (bannerTimer) clearTimeout(bannerTimer);
  bannerTimer = setTimeout(function () { root.innerHTML = ''; }, 8000);
}
function freshSos(alarm) {
  return !!(alarm && alarm.kind === 'sos' && !alarm.resolved && !alarm.acknowledged && (Date.now() - alarm.createdAt) <= SOS_FRESH);
}
function showSosBanner(alarm) {
  const root = document.getElementById('bannerRoot');
  if (!root || !alarm) return;
  if (bannerTimer) { clearTimeout(bannerTimer); bannerTimer = 0; }
  const text = t('SOS จากนักศึกษา', 'Student SOS') + ' · ' + (alarm.reporterName || '') + ' · ' + (alarm.room || '') + (alarm.phone ? ' · ' + alarm.phone : '');
  root.innerHTML = '<div class="live-banner sos-banner" data-sos-banner role="alert"><b>' + esc(text) + '</b><button type="button" data-act="ack-sos" data-id="' + esc(alarm.id) + '">' + esc(t('รับทราบเหตุ', 'Acknowledge')) + '</button></div>';
}
function notifyAdminSos(alarm) {
  if (!alarm || !isAdmin()) return;
  showSosBanner(alarm);
  state.session.sosNotified = state.session.sosNotified || {};
  if (state.session.sosNotified[alarm.id] || !window.Notification) return;
  state.session.sosNotified[alarm.id] = true;
  const title = t('SOS จากนักศึกษา', 'Student SOS');
  const body = (alarm.reporterName || '') + ' · ' + (alarm.room || '') + (alarm.phone ? ' · ' + alarm.phone : '');
  const fire = function () {
    try { new Notification(title, { body: body, tag: alarm.id }); } catch (e) { /* this browser blocked it */ }
  };
  if (Notification.permission === 'granted') fire();
  else if (Notification.permission !== 'denied') Notification.requestPermission().then(function (p) { if (p === 'granted') fire(); });
}
function armSosExpiry(alarm) {
  if (sosExpiryTimer) clearTimeout(sosExpiryTimer);
  if (!alarm) { sosExpiryTimer = 0; return; }
  const left = alarm.createdAt + SOS_FRESH - Date.now();
  sosExpiryTimer = setTimeout(function () {
    sosExpiryTimer = 0;
    state.session.alarmSig = '';
    stopSiren();
    scanAlarms();
  }, Math.max(0, left) + 40);
}

function pendingAlarms() {
  if (!state.user) return [];
  const floor = String(state.user.floor || '');
  return (state.data.alarms || []).filter(function (a) {
    if (!a || a.resolved) return false;
    if (a.kind === 'sos') {
      if (!isAdmin() || a.reporterId === state.user.id || a.acknowledged) return false;
      return (Date.now() - a.createdAt) <= SOS_FRESH;
    }
    if (a.kind !== 'broadcast' || !isStudent()) return false;
    if ((a.acks || []).indexOf(state.user.id) >= 0) return false;
    const floors = a.floors || [];
    if (floors.indexOf('all') >= 0) return true;
    if (floors.indexOf(floor) < 0) return false;
    const floorNum = Number(floor);
    const building = Number(state.user.building);
    if (floorNum >= 6 && floorNum <= 10) return building >= 9 && building <= 12;
    return floorNum >= 1 && floorNum <= 5 && building >= 1 && building <= 12;
  }).sort(function (a, b) { return b.createdAt - a.createdAt; });
}

function scanAlarms() {
  const pending = pendingAlarms();
  const newest = pending[0];
  const sos = pending.filter(function (a) { return a.kind === 'sos'; })[0];
  if (sos) armSosExpiry(sos);
  if (newest && !state.session.heard[newest.id]) {
    state.session.heard[newest.id] = true;
    state.session.needSoundTap = false;
    if (document.visibilityState !== 'visible' && newest.kind === 'sos') notifyAdminSos(newest);
    if (state.session.modal && newest.kind !== 'sos') {
      state.session.modal = null;
      state.session.skipModalCapture = true;
    }
    const live = document.getElementById('liveStatus');
    if (live) live.textContent = tx(newest.title || newest.note || newest.sosType);
    render();
    return;
  }
  renderAlarmOverlay(pending);
}

function primeArrivals() {
  (state.data.foodRounds || []).forEach(function (r) {
    if (r.arrivedAt) state.session.heardArrival[r.id] = true;
  });
}
function scanArrivals() {
  let played = false;
  (state.data.foodRounds || []).forEach(function (r) {
    if (r.arrivedAt && !state.session.heardArrival[r.id]) {
      state.session.heardArrival[r.id] = true;
      played = true;
    }
  });
  if (played && state.user) beep('info');
}

async function loadWeather() {
  state.weather = { loading: true };
  paintWeather();
  try {
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=13.7275&longitude=100.778&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=precipitation_probability_max&timezone=Asia%2FBangkok&forecast_days=1';
    const res = await fetch(url);
    if (!res.ok) throw new Error('weather');
    const j = await res.json();
    state.weather = {
      ok: true,
      sample: false,
      temp: Math.round(j.current.temperature_2m),
      humidity: Math.round(j.current.relative_humidity_2m),
      wind: Math.round(j.current.wind_speed_10m),
      code: j.current.weather_code,
      pop: j.daily && j.daily.precipitation_probability_max ? j.daily.precipitation_probability_max[0] : null
    };
  } catch (e) {
    state.weather = { ok: false, sample: true, temp: 31, humidity: 74, wind: 14, code: 80, pop: 70 };
  }
  paintWeather();
}

  const s = statusLabel(kind, value);
  return '<span class="badge ' + s.cls + '">' + esc(s.text) + '</span>';
}

function shuttlePhase(s) {
  if (['cancelled', 'delayed', 'boarding', 'departed'].indexOf(s.status) >= 0) return s.status;
  const now = bkkMinutes();
  const at = toMin(s.time);
  if (s.status === 'scheduled' && now > at + 10) return 'passed';
  if (s.status === 'scheduled' && at - now <= 15 && at - now >= -2) return 'soon';
  return s.status || 'scheduled';
}

function activeRounds() {
  return (state.data.foodRounds || []).slice().sort(function (a, b) {
    const score = function (r) { return r.status === 'open' ? 0 : (r.arrivedAt ? 1 : 2); };
    if (score(a) !== score(b)) return score(a) - score(b);
    return (a.deadline || 0) - (b.deadline || 0);
  });
}

function renderSimCctv() {
  const w = state.data.waterLevel || {};
  const cm = Number(w.cm) || 0;
  let height = Math.max(12, Math.min(78, cm / 80 * 70));
  if (w.status === 'critical') height = Math.max(height, 58);
  else if (w.status === 'caution') height = Math.max(height, 34);
  const label = statusLabel('waterLv', w.status || 'normal');
  return '<div class="cctv" aria-label="' + esc(t('ภาพจำลองกล้องหน้าหอ', 'Simulated dorm-gate camera')) + '">' +
    '<div class="cctv-sky"></div><div class="cctv-skyline"></div><div class="cctv-gate"></div><div class="cctv-ground"></div>' +
    '<div class="cctv-water" style="height:' + height + '%"></div><div class="cctv-scan"></div>' +
    '<div class="cctv-tag"><span class="rec-dot"></span> REC · CAM-GATE</div>' +
    '<div class="cctv-time" data-clock>—</div>' +
    '<div class="sim-flag">SIMULATED</div>' +
    '<div class="cctv-gauge"><span>' + esc(label.text) + '</span><b>' + esc(String(cm)) + ' cm</b></div></div>';
}
function renderStream() {
  const raw = (state.data.waterLevel && state.data.waterLevel.streamUrl) || '';
  const trimmed = String(raw).trim();
  if (/^rtsp:/i.test(trimmed)) {
    return '<div class="card p-3 mb-2 text-sm text-amber-800 bg-amber-50 border-amber-200">' +
      esc(t('เบราว์เซอร์เปิด RTSP โดยตรงไม่ได้ ให้นำสัญญาณไปแปลงเป็น HLS (.m3u8), MP4 หรือ YouTube Live แล้ววางลิงก์นั้น', 'Browsers cannot play RTSP directly. Restream the camera to HLS (.m3u8), MP4, or YouTube Live and paste that URL.')) +
      '</div>' + renderSimCctv();
  }
  const safe = safeHttpUrl(trimmed);
  if (!safe) return renderSimCctv();
  if (/\.(m3u8|mp4)(\?|$)/i.test(safe)) {
    return '<div class="cctv"><video class="cctv-video" controls playsinline src="' + esc(safe) + '"></video></div>';
  }
  const yt = safe.match(/(?:youtube\.com\/(?:watch\?v=|live\/|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  const src = yt ? ('https://www.youtube-nocookie.com/embed/' + yt[1] + '?rel=0') : safe;
  return '<div class="cctv"><iframe class="cctv-video" title="' + esc(t('ภาพระดับน้ำหน้าหอ', 'Front-of-dorm water level')) + '" src="' + esc(src) + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>';
}

      '<div class="mt-2 text-sm opacity-80">' + esc(newest.reporterName || '') + ' · ' + esc(t('ชั้น', 'Floor')) + ' ' + esc(newest.floor || '—') + ' · ' + esc(relTime(newest.createdAt)) + '</div>' +
      (newest.phone ? '<a class="btn btn-ghost mt-3" href="' + telHref(newest.phone) + '">' + icon('phone') + esc(newest.phone) + '</a>' : '') +
      '<button type="button" class="btn btn-block mt-4" style="background:#fff;color:#7f1d1d" data-act="ack-sos" data-id="' + esc(newest.id) + '">' + esc(t('รับทราบเหตุ', 'Acknowledge')) + '</button>';

function readBi(fd, prefix) {
  const th = String(fd.get(prefix + 'Th') || '').trim();

function captureLoginDraft() {
  const form = document.getElementById('loginForm');
  if (!form) return;
  const fd = new FormData(form);
  const next = { role: (state.session.draftLogin && state.session.draftLogin.role) || 'student' };
  fd.forEach(function (value, key) {
    if (key === 'role') return;
    next[key] = value;
  });
  if (next.buildingNo || next.floorRoom) {
    next.room = String(next.buildingNo || '').replace(/\D/g, '') + '-' + String(next.floorRoom || '').replace(/\D/g, '');
  }
  state.session.draftLogin = next;
}
function captureModalDraft() {
  const form = document.querySelector('#modalRoot form');
  if (!form || !state.session.modal) return;
  const fd = new FormData(form);
  const obj = {};
  fd.forEach(function (value, key) {
    if (obj[key] !== undefined) {
      if (!Array.isArray(obj[key])) obj[key] = [obj[key]];
      obj[key].push(value);
    } else obj[key] = value;
  });
  state.session.modal.draft = obj;
}

function doDelete(kind, id, roundId) {
  if (kind === 'order') {
    const existing = findById(state.data.foodOrders, id);
    if (!existing || !state.user || existing.userId !== state.user.id) {
      toast('แก้ได้เฉพาะออเดอร์ของตัวเอง', 'You can change only your own order.');
      return;
    }
  }
  mutate(function (data) {
    if (kind === 'shuttle') data.shuttles = data.shuttles.filter(function (x) { return x.id !== id; });
    if (kind === 'boat') data.boats = data.boats.filter(function (x) { return x.id !== id; });
    if (kind === 'pin') {
      data.pins = data.pins.filter(function (x) { return x.id !== id; });
      if (state.session.selectedPin === id) state.session.selectedPin = null;
    }
    if (kind === 'news') data.news = data.news.filter(function (x) { return x.id !== id; });
    if (kind === 'round') {
      data.foodRounds = data.foodRounds.filter(function (x) { return x.id !== id; });
      data.foodOrders = data.foodOrders.filter(function (x) { return x.roundId !== id; });
    }
    if (kind === 'item') {
      const round = findById(data.foodRounds, roundId);
      if (round) round.menu = (round.menu || []).filter(function (m) { return m.id !== id; });
      data.foodOrders = data.foodOrders.filter(function (o) { return !(o.roundId === roundId && o.itemId === id); });
    }
    if (kind === 'order') data.foodOrders = data.foodOrders.filter(function (o) { return o.id !== id; });
  });
}

function onClick(e) {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  if (act === 'lang') {
    state.lang = btn.dataset.lang === 'en' ? 'en' : 'th';
    savePref();
    state.session.alarmSig = '';
    render();
    return;
  }
  if (act === 'go') {
    state.session.view = btn.dataset.view || 'home';
    if (btn.dataset.transit) state.session.transitTab = btn.dataset.transit;
    if (btn.dataset.board) state.session.boardTab = btn.dataset.board;
    if (btn.dataset.dorm) state.session.dormTab = btn.dataset.dorm;
    state.session.keepScroll = false;
    render();
    document.getElementById('viewScroll').scrollTop = 0;
    return;
  }
  if (act === 'subtab') {
    state.session[btn.dataset.key] = btn.dataset.val;
    render();
    return;
  }
  if (act === 'close-modal') { closeModal(); return; }
  if (act === 'open-setup') { openModal({ name: 'setup' }); return; }
  if (act === 'open-calls') { openModal({ name: 'calls' }); return; }
  if (act === 'role') {
    captureLoginDraft();
    state.session.draftLogin.role = btn.dataset.role;
    render();
    return;
  }
  if (act === 'demo-student') { enterDemoStudent(); return; }
  if (act === 'demo-admin') { enterDemoAdmin(); return; }
  if (act === 'logout') { logout(); return; }
  if (act === 'profile-open') { if (state.user) openModal({ name: 'profile' }); return; }
  if (act === 'sos-open') { openModal({ name: 'sos' }); return; }
  if (act === 'broadcast-open') { openModal({ name: 'broadcast' }); return; }
  if (act === 'sound-toggle') {
    state.local.sound = !state.local.sound;
    savePref();
    if (!state.local.sound) stopSiren();
    else beep('info');
    renderChrome();
    return;
  }
  if (act === 'sound-on') {
    state.local.sound = true;
    savePref();
    const sos = pendingAlarms().some(function (a) { return a.kind === 'sos'; });
    state.session.needSoundTap = sos ? !startSiren() : !playUrgentBurst();
    state.session.alarmSig = '';
    renderAlarmOverlay(pendingAlarms());
    renderChrome();
    return;
  }
  if (act === 'close-banner') {
    const banner = document.getElementById('bannerRoot');
    if (banner) banner.innerHTML = '';
    return;
  }
  if (act === 'ack-sos') {
    if (!isAdmin()) return;
    const id = btn.dataset.id;
    stopSiren();
    const banner = document.getElementById('bannerRoot');
    if (banner) banner.innerHTML = '';
    mutate(function (data) {
      const alarm = findById(data.alarms, id);
      if (!alarm) return;
      alarm.acknowledged = true;
      alarm.acks = alarm.acks || [];
      if (alarm.acks.indexOf(state.user.id) < 0) alarm.acks.push(state.user.id);
    });
    return;
  }
  if (act === 'ack-alarm') {
    const id = btn.dataset.id;
    mutate(function (data) {
      const alarm = findById(data.alarms, id);
      if (!alarm) return;
      alarm.acks = alarm.acks || [];
      if (alarm.acks.indexOf(state.user.id) < 0) alarm.acks.push(state.user.id);
    });
    return;
  }
  if (act === 'resolve-alarm') {
    const id = btn.dataset.id;
    mutate(function (data) {
      const alarm = findById(data.alarms, id);
      if (alarm) alarm.resolved = true;
    });
    return;
  }
  if (act === 'dismiss-arrival') {
    state.session.dismissedArrival[btn.dataset.id] = true;
    saveSession();
    render();
    return;
  }
  if (act === 'shuttle-edit') { openModal({ name: 'shuttle', id: btn.dataset.id || '' }); return; }
  if (act === 'shuttle-status') {
    mutate(function (data) {
      const s = findById(data.shuttles, btn.dataset.id);
      if (!s) return;
      s.status = btn.dataset.status;
      if (s.status === 'delayed' && !s.delayMin) s.delayMin = 10;
    });
    return;
  }
  if (act === 'boat-edit') { openModal({ name: 'boat', id: btn.dataset.id || '' }); return; }
  if (act === 'boat-book') {
    if (!isStudent()) return;
    openModal({ name: 'booking', id: btn.dataset.id || '' });
    return;
  }
  if (act === 'boat-reset') {
    mutate(function (data) {
      const b = findById(data.boats, btn.dataset.id);
      if (!b) return;
      b.bookings = [];
      b.status = 'available';
      b.capacity = BOAT_CAP;
      b.updatedAt = Date.now();
    });
    return;
  }
  if (act === 'boat-status') {
    mutate(function (data) {
      const b = findById(data.boats, btn.dataset.id);
      if (!b) return;
      b.status = btn.dataset.status === 'maintenance' ? 'maintenance' : 'available';
      if (b.status === 'available') b.bookings = [];
      b.capacity = BOAT_CAP;
      b.updatedAt = Date.now();
    });
    return;
  }
  if (act === 'round-edit') { if (!isAdmin()) return; openModal({ name: 'round', id: btn.dataset.id || '' }); return; }
  if (act === 'round-toggle') {
    if (!isAdmin()) return;
    mutate(function (data) {
      const r = findById(data.foodRounds, btn.dataset.id);
      if (r) r.status = r.status === 'open' ? 'closed' : 'open';
    });
    return;
  }
  if (act === 'item-edit') { if (!isAdmin()) return; openModal({ name: 'item', round: btn.dataset.round, id: btn.dataset.id || '' }); return; }
  if (act === 'order-add') { openModal({ name: 'order', id: btn.dataset.id }); return; }
  if (act === 'order-edit') {
    const order = findById(state.data.foodOrders, btn.dataset.id);
    if (!order || !state.user || order.userId !== state.user.id) return;
    if (!order.phone || phoneVerified(order.phone) || state.user.phone === order.phone) {
      rememberPhone(order.phone);
      state.session.editingOrder = order.id;
      render();
      return;
    }
    openModal({ name: 'order-phone', id: order.id });
    return;
  }
  if (act === 'order-edit-cancel') {
    state.session.editingOrder = null;
    render();
    return;
  }
  if (act === 'order-delete') {
    const order = findById(state.data.foodOrders, btn.dataset.id);
    if (!order || !state.user || order.userId !== state.user.id) return;
    if (order.phone && !phoneVerified(order.phone) && state.user.phone !== order.phone) return;
    state.session.editingOrder = null;
    doDelete('order', order.id);
    return;
  }
  if (act === 'order-status') {
    mutate(function (data) {
      const o = findById(data.foodOrders, btn.dataset.id);
      if (o) o.status = btn.dataset.status;
    });
    return;
  }
  if (act === 'sensor-select') {
    const sensor = findById(state.data.sensors, btn.dataset.id);
    state.session.selectedSensor = btn.dataset.id;
    if (sensor) state.session.mapView = { lat: sensor.lat, lng: sensor.lng, zoom: Math.max(16, (state.session.mapView && state.session.mapView.zoom) || 16) };
    state.session.keepScroll = true;
    render();
    return;
  }
  if (act === 'sensor-toggle') { toggleSensor(btn.dataset.id); return; }
  if (act === 'sensor-scan') { simulateSensorScan(); return; }
  if (act === 'pin-select') {
    state.session.selectedPin = btn.dataset.id;
    state.session.keepScroll = true;
    render();
    return;
  }
  if (act === 'pin-edit') { openModal({ name: 'pin', id: btn.dataset.id }); return; }
  if (act === 'news-edit') { openModal({ name: 'news', id: btn.dataset.id || '' }); return; }
  if (act === 'water-edit') { openModal({ name: 'water' }); return; }
  if (act === 'utility-note') { openModal({ name: 'utility-note' }); return; }
  if (act === 'utility-set') {
    const key = btn.dataset.key;
    const val = btn.dataset.val;
    mutate(function (data) {
      data.utility[key] = val;
      data.utility.updatedAt = Date.now();
      data.utility.updatedBy = state.user.name;
    });
    return;
  }
  if (act === 'leak-resolve') {
    if (!isAdmin()) return;
    mutate(function (data) {
      const leak = findById(data.leaks, btn.dataset.id);
      if (leak) leak.resolved = true;
    });
    return;
  }
  if (act === 'ask-delete') {
    openModal({ name: 'confirm', tone: 'danger', th: 'ลบรายการนี้ถาวร?', en: 'Delete this permanently?', act: 'confirm-delete', id: btn.dataset.id, kind: btn.dataset.kind, round: btn.dataset.round || '' });
    return;
  }
  if (act === 'confirm-delete') {
    const kind = btn.dataset.kind;
    const id = btn.dataset.id;
    const round = btn.dataset.round;
    state.session.modal = null;
    state.session.skipModalCapture = true;
    doDelete(kind, id, round);
    return;
  }
  if (act === 'ask-arrive') {
    if (!isAdmin()) return;
    openModal({ name: 'confirm', th: 'ประกาศว่าอาหารรอบนี้มาถึงแล้ว? ทุกคนจะเห็นแบนเนอร์', en: 'Announce that this round has arrived? Everyone will see a banner.', act: 'confirm-arrive', id: btn.dataset.id });
    return;
  }
  if (act === 'confirm-arrive') {
    const id = btn.dataset.id;
    state.session.modal = null;
    state.session.skipModalCapture = true;
    mutate(function (data) {
      const round = findById(data.foodRounds, id);
      if (!round) return;
      round.arrivedAt = Date.now();
      round.status = 'closed';
      data.foodOrders.forEach(function (o) { if (o.roundId === id) o.status = 'arrived'; });
    });
    scanArrivals();
    return;
  }
  if (act === 'ask-reset') {
    openModal({ name: 'confirm', tone: 'danger', th: 'ล้างข้อมูลบนเครื่องนี้แล้วใส่ตัวอย่างใหม่?', en: 'Erase on-device data and restore the sample campus?', act: 'confirm-reset' });
    return;
  }
  if (act === 'confirm-reset') {
    state.data = seed();
    saveData();
    state.session.modal = null;
    state.session.selectedPin = null;
    primeArrivals();
    render();
    toast('คืนข้อมูลตัวอย่างแล้ว', 'Sample data restored.');
    return;
  }
  if (act === 'disconnect-firebase') { disconnectFirebase(); return; }
  if (act === 'copy-rules') {
    const done = function () { toast('คัดลอกกฎแล้ว', 'Rules copied.'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(FIRESTORE_RULES).then(done).catch(function () { toastRaw(FIRESTORE_RULES); });
    else toastRaw(FIRESTORE_RULES);
  }
}

function onSubmit(e) {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  const kind = form.dataset.form;
  const fd = new FormData(form);
  const get = function (key) { return String(fd.get(key) || '').trim(); };
  if (kind === 'login') { submitLogin(fd, form); return; }
  if (kind === 'firebase') { submitFirebase(fd, form); return; }
  if (kind === 'admin-code') {
    const code = get('adminCode');
    if (code.length < 4) { toast('รหัสควรยาวอย่างน้อย 4 ตัว', 'Use at least 4 characters.'); return; }
    state.local.adminCode = code;
    savePref();
    toast('บันทึกรหัสเจ้าหน้าที่บนเครื่องนี้แล้ว', 'Staff code saved on this device.');
    return;
  }
  if (kind === 'profile') {
    const name = get('name');
    if (!name) { showFormError(t('กรอกชื่อก่อน', 'Enter your name.')); return; }
    if (isStudent()) {
      const sid = parseStudentId(get('studentId'));
      const parsed = roomFromForm(fd);
      const phone = parsePhone(get('phone'), false);
      if (!sid) { showFormError(studentIdError()); return; }
      if (!parsed) { showFormError(roomError()); return; }
      if (!phone) { showFormError(phoneError()); return; }
      state.user.studentId = sid;
      applyStay(parsed, phone.phone);
      if (phone.phone) rememberPhone(phone.phone);
    }
    state.user.name = name;
    saveSession();
    closeModal();
    toast('บันทึกโปรไฟล์แล้ว', 'Profile saved.');
    return;
  }
  if (kind === 'sos') { submitSos(fd); return; }
  if (kind === 'broadcast') { submitBroadcast(fd); return; }
  if (kind === 'shuttle') { submitShuttle(fd); return; }
  if (kind === 'round') { submitRound(fd); return; }
  if (kind === 'item') { submitItem(fd); return; }
  if (kind === 'order') { submitOrder(fd); return; }
  if (kind === 'order-edit') { submitOrderEdit(fd, form); return; }
  if (kind === 'order-phone') { submitOrderPhone(fd, form); return; }
  if (kind === 'boat') { submitBoat(fd); return; }
  if (kind === 'booking') { submitBooking(fd); return; }
  if (kind === 'pin') { submitPin(fd); return; }
  if (kind === 'news') { submitNews(fd); return; }
  if (kind === 'water') { submitWater(fd); return; }
  if (kind === 'utility-note') {
    const note = readBi(fd, 'note');
    mutate(function (data) {
      data.utility.note = note;
      data.utility.updatedAt = Date.now();
      data.utility.updatedBy = state.user.name;
    });
    closeModal();
    return;
  }
  if (kind === 'leak') { submitLeak(fd, form); return; }
  if (kind === 'utility') { submitUtility(fd, form); return; }
}

function submitLogin(fd, form) {
  const role = String(fd.get('role') || 'student');
  const name = String(fd.get('name') || '').trim();
  const err = form.querySelector('#loginError');
  const fail = function (th, en) { err.textContent = t(th, en); err.classList.remove('hidden'); };
  if (!name) { fail('กรอกชื่อก่อน', 'Enter your name.'); return; }
  if (role === 'admin') {
    const email = String(fd.get('email') || '').trim();
    const password = String(fd.get('password') || '');
    const code = String(fd.get('code') || '');
    if (email && password && state.local.firebaseConfig) {
      loginAdminEmail(email, password, name, String(fd.get('staffId') || '').trim(), err);
      return;
    }
    if (code.trim() !== String(state.local.adminCode || DEFAULT_ADMIN_CODE)) {
      fail('รหัสเจ้าหน้าที่ไม่ถูกต้อง', 'Staff code is incorrect.');
      return;
    }
    state.user = { id: 'staff-' + (String(fd.get('staffId') || 'staff').trim() || 'staff'), role: 'admin', name: name, staffId: String(fd.get('staffId') || '').trim(), building: '', floor: 1, room: '', phone: '' };
    finishLogin();
    return;
  }
  const studentId = parseStudentId(fd.get('studentId'));
  const parsed = roomFromForm(fd);
  const phone = parsePhone(fd.get('phone'), false);
  if (!studentId) { fail(studentIdError(), studentIdError()); return; }
  if (!parsed) { fail(roomError(), roomError()); return; }
  if (!phone) { fail(phoneError(), phoneError()); return; }
  state.user = {
    id: 'stu-' + studentId,
    role: 'student',
    name: name,
    studentId: studentId,
    building: parsed.building,
    floor: parsed.floor,
    room: parsed.canonical,
    phone: phone.phone
  };
  finishLogin();
}
async function loginAdminEmail(email, password, name, staffId, err) {
  try {
    await loadFirebaseSdk();
    if (!firebase.apps.length) await connectFirebase(state.local.firebaseConfig, { silent: true });
    await firebase.auth().signInWithEmailAndPassword(email, password);
    state.user = { id: 'staff-' + (staffId || email), role: 'admin', name: name, staffId: staffId, email: email, building: '', floor: 1, room: '', phone: '' };
    finishLogin();
  } catch (e) {
    err.textContent = e.message || String(e);
    err.classList.remove('hidden');
  }
}

  const phone = parsePhone(fd.get('phone'), true);

  mutate(function (data) {
    data.alarms.unshift({
      id: uid('sos'),
      kind: 'sos',
      level: 'critical',
      sosType: String(fd.get('sosType') || 'other'),

    });

function submitBroadcast(fd) {

      floors: floors,

      createdAt: Date.now(),

    });

  if (!pendingAlarms().some(function (a) { return a.kind === 'sos'; })) stopSiren();

}
function submitShuttle(fd) {
  const dest = readBi(fd, 'dest');
  if (!biOk(dest)) { showFormError(t('กรอกปลายทางภาษาต้นฉบับ', 'Enter the original-language destination.')); return; }
  const time = String(fd.get('time') || '');
  mutate(function (data) {
    const row = {
      id: String(fd.get('id') || '') || uid('bus'),
      time: time,
      dest: dest,
      note: readBi(fd, 'note'),
      status: String(fd.get('status') || 'scheduled'),
      delayMin: Number(fd.get('delayMin') || 0)
    };
    const idx = data.shuttles.findIndex(function (s) { return s.id === row.id; });
    if (idx >= 0) data.shuttles[idx] = row;
    else data.shuttles.push(row);
  });
  closeModal();
}
function combineDeadline(dateStr, timeStr) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr) || !/^\d{2}:\d{2}$/.test(timeStr)) return Date.now();
  return Date.parse(dateStr + 'T' + timeStr + ':00+07:00');
}
function submitRound(fd) {
  const title = readBi(fd, 'title');
  if (!biOk(title)) { showFormError(t('กรอกชื่อรอบภาษาต้นฉบับ', 'Enter the original-language round name.')); return; }
  const endLabel = String(fd.get('endLabel') || '12:00');
  mutate(function (data) {
    const id = String(fd.get('id') || '') || uid('round');
    const prev = findById(data.foodRounds, id);
    const row = {
      id: id,
      title: title,
      note: readBi(fd, 'note'),
      startLabel: String(fd.get('startLabel') || '11:00'),
      endLabel: endLabel,
      deadline: combineDeadline(String(fd.get('date') || bkkToday()), endLabel),
      status: String(fd.get('status') || 'open') === 'closed' ? 'closed' : 'open',
      createdAt: prev ? prev.createdAt : Date.now(),
      arrivedAt: prev ? prev.arrivedAt : null,
      menu: prev ? prev.menu : []
    };
    const idx = data.foodRounds.findIndex(function (r) { return r.id === id; });
    if (idx >= 0) data.foodRounds[idx] = row;
    else data.foodRounds.unshift(row);
  });
  closeModal();
}
function submitItem(fd) {
  const name = readBi(fd, 'name');
  if (!biOk(name)) { showFormError(t('กรอกชื่อเมนูภาษาต้นฉบับ', 'Enter the original-language item name.')); return; }
  const price = Number(fd.get('price'));
  if (!isFinite(price) || price < 0) { showFormError(t('ใส่ราคาให้ถูกต้อง', 'Enter a valid price.')); return; }
  const roundId = String(fd.get('round') || '');
  mutate(function (data) {
    const round = findById(data.foodRounds, roundId);
    if (!round) return;
    round.menu = round.menu || [];
    const id = String(fd.get('id') || '') || uid('item');
    const prev = findById(round.menu, id);
    const row = { id: id, name: name, price: Math.round(price), createdAt: prev ? prev.createdAt : Date.now() };
    const idx = round.menu.findIndex(function (m) { return m.id === id; });
    if (idx >= 0) round.menu[idx] = row;
    else round.menu.push(row);
  });
  closeModal();
}
function submitOrder(fd) {

function submitOrderEdit(fd, form) {

function submitBoat(fd) {
  const name = String(fd.get('name') || '').trim();
  if (!name) { showFormError(t('กรอกชื่อเรือ', 'Enter a boat name.')); return; }
  mutate(function (data) {
    const id = String(fd.get('id') || '') || uid('boat');
    const prev = findById(data.boats, id);
    const status = String(fd.get('status')) === 'maintenance' ? 'maintenance' : 'available';
    const row = {
      id: id,
      name: name,
      capacity: BOAT_CAP,
      status: status,
      bookings: status === 'available' ? [] : (prev && prev.bookings ? prev.bookings : []),
      note: readBi(fd, 'note'),
      updatedAt: Date.now()
    };
    if (prev && !row.note.th && !row.note.en) row.note = prev.note;
    if (status !== 'maintenance' && boatOccupied(row) > 0) row.status = 'full';
    const idx = data.boats.findIndex(function (b) { return b.id === id; });
    if (idx >= 0) data.boats[idx] = row;
    else data.boats.push(row);
  });
  closeModal();
}
function submitBooking(fd) {
  if (!isStudent()) { showFormError(t('เฉพาะนักศึกษาจองเรือได้', 'Only students can book a boat.')); return; }
  const name = String(fd.get('name') || '').trim();
  const parsed = roomFromForm(fd);
  const phone = parsePhone(fd.get('phone'), true);
  const passengers = Number(fd.get('passengers'));
  if (!name) { showFormError(t('กรอกชื่อ', 'Enter your name.')); return; }
  if (!parsed) { showFormError(roomError()); return; }
  if (!phone) { showFormError(phoneError()); return; }
  if (!isFinite(passengers) || passengers < 1 || passengers > BOAT_CAP) {
    showFormError(t('จำนวนผู้โดยสารต้องอยู่ระหว่าง 1 ถึง 4 คน', 'Passengers must be between 1 and 4.'));
    return;
  }
  const boatId = String(fd.get('boatId') || '');
  const target = findById(state.data.boats, boatId);
  if (!target || boatLiveStatus(target) !== 'available') {
    showFormError(t('เรือลำนี้เต็มหรือกำลังใช้งานอยู่', 'This boat is full or already in use.'));
    return;
  }
  applyStay(parsed, phone.phone);
  state.user.name = name;
  saveSession();
  mutate(function (data) {
    const boat = findById(data.boats, boatId);
    if (!boat || boatLiveStatus(boat) !== 'available') return;
    boat.bookings = boat.bookings || [];
    boat.bookings.push({
      id: uid('book'),
      name: name,
      room: parsed.canonical,
      phone: phone.phone,
      passengers: passengers,
      userId: state.user.id,
      createdAt: Date.now()
    });
    boat.capacity = BOAT_CAP;
    boat.status = 'full';
    boat.updatedAt = Date.now();
  });
  closeModal();
  toast('จองเรือแล้ว', 'Boat booked.');
}
function submitPin(fd) {
  const title = readBi(fd, 'title');
  if (!biOk(title)) { showFormError(t('กรอกชื่อจุดภาษาต้นฉบับ', 'Enter the original-language pin title.')); return; }
  const lat = Number(fd.get('lat'));
  const lng = Number(fd.get('lng'));
  if (!isFinite(lat) || !isFinite(lng)) { showFormError(t('ตำแหน่งหมุดไม่ถูกต้อง', 'Pin location is invalid.')); return; }
  mutate(function (data) {
    const id = String(fd.get('id') || '') || uid('pin');
    const prev = findById(data.pins, id);
    const row = {
      id: id,
      lat: lat,
      lng: lng,
      severity: String(fd.get('severity')) === 'warning' ? 'warning' : 'critical',
      title: title,
      detail: readBi(fd, 'detail'),
      createdAt: prev ? prev.createdAt : Date.now()
    };
    const idx = data.pins.findIndex(function (p) { return p.id === id; });
    if (idx >= 0) data.pins[idx] = row;
    else data.pins.push(row);
    state.session.selectedPin = id;
  });
  closeModal();
}
function submitNews(fd) {
  const title = readBi(fd, 'title');
  const body = readBi(fd, 'body');
  if (!biOk(title) || !biOk(body)) { showFormError(t('กรอกหัวข้อและเนื้อหาภาษาต้นฉบับ', 'Enter the original-language title and body.')); return; }
  mutate(function (data) {
    const id = String(fd.get('id') || '') || uid('news');
    const prev = findById(data.news, id);
    const row = {
      id: id,
      tag: ['info', 'warning', 'urgent'].indexOf(String(fd.get('tag'))) >= 0 ? String(fd.get('tag')) : 'info',
      pinned: fd.get('pinned') === '1',
      title: title,
      body: body,
      author: state.user.name,
      createdAt: prev ? prev.createdAt : Date.now()
    };
    const idx = data.news.findIndex(function (n) { return n.id === id; });
    if (idx >= 0) data.news[idx] = row;
    else data.news.unshift(row);
  });
  closeModal();
}
function submitWater(fd) {
  const cm = Number(fd.get('cm'));
  if (!isFinite(cm) || cm < 0 || cm > 400) { showFormError(t('ระดับน้ำต้องอยู่ระหว่าง 0 ถึง 400 ซม.', 'Water level must be between 0 and 400 cm.')); return; }
  const url = String(fd.get('streamUrl') || '').trim();
  if (url && !/^rtsp:/i.test(url) && !safeHttpUrl(url)) { showFormError(t('ลิงก์ต้องขึ้นต้นด้วย http, https หรือ rtsp', 'The URL must start with http, https, or rtsp.')); return; }
  mutate(function (data) {
    data.waterLevel.status = ['normal', 'caution', 'critical'].indexOf(String(fd.get('status'))) >= 0 ? String(fd.get('status')) : 'caution';
    data.waterLevel.cm = Math.round(cm);
    data.waterLevel.note = readBi(fd, 'note');
    data.waterLevel.streamUrl = url;
    data.waterLevel.updatedAt = Date.now();
    data.waterLevel.updatedBy = state.user.name;
  });
  closeModal();
}
function submitLeak(fd, form) {
  const desc = readMono(fd, 'desc');
  const parsed = roomFromForm(fd);
  const phone = parsePhone(fd.get('phone'), true);
  const el = form.querySelector('#formError');
  const fail = function (msg) { el.textContent = msg; el.classList.remove('hidden'); };
  if (!parsed) { fail(roomError()); return; }
  if (!phone) { fail(phoneError()); return; }
  if (!biOk(desc)) { fail(t('กรอกรายละเอียด', 'Enter a description.')); return; }
  applyStay(parsed, phone.phone);
  saveSession();
  mutate(function (data) {
    data.leaks.unshift({
      id: uid('leak'),
      room: parsed.canonical,
      building: parsed.building,
      floor: parsed.floor,
      phone: phone.phone,
      severity: ['low', 'medium', 'high'].indexOf(String(fd.get('severity'))) >= 0 ? String(fd.get('severity')) : 'medium',
      desc: desc,
      reporter: state.user.name,
      createdAt: Date.now(),
      resolved: false
    });
  });
  state.session.leakPrivate = true;
  render();
  toast('ส่งรายงานให้เจ้าหน้าที่แล้ว คนอื่นในหอไม่เห็นรายการนี้', 'Sent to staff only. Other residents cannot see this report.');
}
function submitUtility(fd, form) {
  const parsed = roomFromForm(fd);
  const phone = parsePhone(fd.get('phone'), true);
  const el = form.querySelector('#formError');
  const fail = function (msg) { el.textContent = msg; el.classList.remove('hidden'); };
  if (!parsed) { fail(roomError()); return; }
  if (!phone) { fail(phoneError()); return; }
  applyStay(parsed, phone.phone);
  saveSession();
  const note = readMono(fd, 'note');
  mutate(function (data) {
    data.utilityReports.unshift({
      id: uid('util'),
      room: parsed.canonical,
      building: parsed.building,
      floor: parsed.floor,
      phone: phone.phone,
      water: String(fd.get('water') || 'flowing'),
      power: String(fd.get('power') || 'on'),
      color: String(fd.get('color') || 'clear'),
      note: note,
      name: state.user.name,
      createdAt: Date.now()
    });
  });
  toast('ส่งสถานะห้องแล้ว', 'Room status sent.');
}
function submitFirebase(fd) {
  const config = {
    apiKey: String(fd.get('apiKey') || '').trim(),
    authDomain: String(fd.get('authDomain') || '').trim(),
    projectId: String(fd.get('projectId') || '').trim(),
    storageBucket: String(fd.get('storageBucket') || '').trim(),
    messagingSenderId: String(fd.get('messagingSenderId') || '').trim(),
    appId: String(fd.get('appId') || '').trim()
  };
  if (!config.apiKey || !config.authDomain || !config.projectId || !config.appId) {
    showFormError(t('ต้องมี apiKey, authDomain, projectId และ appId', 'apiKey, authDomain, projectId, and appId are required.'));
    return;
  }
  const button = document.querySelector('#modalRoot form[data-form="firebase"] button[type="submit"]');
  if (button) button.disabled = true;
  connectFirebase(config).then(function (ok) {
    if (ok) {
      state.local.setupSeen = true;
      savePref();
      state.session.modal = null;
      state.session.skipModalCapture = true;
      render();
    } else if (button) button.disabled = false;
  });
}

function tickClocks() {
  const label = new Intl.DateTimeFormat(state.lang === 'th' ? 'th-TH' : 'en-GB', {
    timeZone: 'Asia/Bangkok',
    weekday: 'short', day: '2-digit', month: 'short',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'
  }).format(new Date());
  document.querySelectorAll('[data-clock]').forEach(function (el) { el.textContent = label; });
}
function isTyping() {
  const ae = document.activeElement;
  if (!ae) return false;
  return ['INPUT', 'TEXTAREA', 'SELECT'].indexOf(ae.tagName) >= 0;
}
let campusMap = null;
function mountCampusMap() {
  if (campusMap) {
    campusMap.remove();
    campusMap = null;
  }
  const el = document.getElementById('campusMap');
  if (!el) return;
  if (typeof L === 'undefined') {
    el.textContent = t('โหลดแผนที่ไม่ได้ ตรวจการเชื่อมต่อแล้วเปิดหน้านี้ใหม่', 'The map could not load. Check the connection and reopen this page.');
    return;
  }
  const saved = state.session.mapView;
  const map = L.map(el, { scrollWheelZoom: true }).setView([CAMPUS_LAT, CAMPUS_LNG], CAMPUS_ZOOM);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);
  campusMap = map;
  if (saved) map.setView([saved.lat, saved.lng], saved.zoom);
  else if ((state.data.sensors || []).length) {
    map.fitBounds(L.latLngBounds(state.data.sensors.map(function (s) { return [s.lat, s.lng]; })), { padding: [28, 28], maxZoom: 16 });
  }
  const byId = {};
  (state.data.sensors || []).forEach(function (s) { byId[s.id] = s; });
  Object.keys(SENSOR_LINES).forEach(function (key) {
    const latlngs = SENSOR_LINES[key].map(function (id) {
      const s = byId[id];
      return s ? [s.lat, s.lng] : null;
    }).filter(Boolean);
    if (latlngs.length > 1) {
      L.polyline(latlngs, { color: '#ea580c', weight: 3, opacity: .72, dashArray: '7 8', interactive: false }).addTo(map);
    }
  });
  const sensorMarkers = {};
  (state.data.sensors || []).forEach(function (s) {
    const lat = Number(s.lat);
    const lng = Number(s.lng);
    if (!isFinite(lat) || !isFinite(lng)) return;
    const leak = s.status === 'leak';
    const marker = L.marker([lat, lng], {
      title: s.id + ' ' + tx(s.road),
      keyboard: true,
      zIndexOffset: leak ? 400 : 0,
      icon: L.divIcon({
        className: 'sensor-pin',
        html: '<span class="sensor-dot ' + (leak ? 'leak' : 'safe') + (s.id === state.session.selectedSensor ? ' sel' : '') + '"></span>',
        iconSize: [44, 44],
        iconAnchor: [22, 22]
      })
    }).addTo(map);
    marker.bindPopup(sensorPopupHtml(s), { maxWidth: 280, autoPan: true });
    sensorMarkers[s.id] = marker;
    marker.on('click', function (ev) {
      L.DomEvent.stop(ev);
      if (ev.originalEvent) ev.originalEvent._pinHandled = true;
      const center = map.getCenter();
      state.session.mapView = { lat: center.lat, lng: center.lng, zoom: map.getZoom() };
      state.session.selectedSensor = s.id;
      state.session.keepScroll = true;
      render();
    });
    marker.on('popupopen', function (ev) {
      const btn = ev.popup.getElement() && ev.popup.getElement().querySelector('[data-act="sensor-toggle"]');
      if (!btn) return;
      L.DomEvent.on(btn, 'click', function (e) {
        L.DomEvent.stop(e);
        toggleSensor(s.id);
      });
    });
  });
  if (state.session.selectedSensor && sensorMarkers[state.session.selectedSensor]) {
    sensorMarkers[state.session.selectedSensor].openPopup();
  }
  (state.data.pins || []).forEach(function (p) {
    const lat = Number(p.lat);
    const lng = Number(p.lng);
    if (!isFinite(lat) || !isFinite(lng)) return;
    const marker = L.marker([lat, lng], {
      title: tx(p.title),
      keyboard: true,
      icon: L.divIcon({
        className: 'leak-pin',
        html: '<span class="leak-dot ' + (p.severity === 'critical' ? 'crit' : 'warn') + (p.id === state.session.selectedPin ? ' sel' : '') + '"></span>',
        iconSize: [22, 22],
        iconAnchor: [11, 11]
      })
    }).addTo(map);
    marker.on('click', function (ev) {
      L.DomEvent.stop(ev);
      if (ev.originalEvent) ev.originalEvent._pinHandled = true;
      const center = map.getCenter();
      state.session.mapView = { lat: center.lat, lng: center.lng, zoom: map.getZoom() };
      state.session.selectedPin = p.id;
      state.session.keepScroll = true;
      render();
    });
  });
  map.on('moveend', function () {
    if (campusMap !== map) return;
    const center = map.getCenter();
    state.session.mapView = { lat: center.lat, lng: center.lng, zoom: map.getZoom() };
  });
  if (isAdmin()) {
    map.on('click', function (ev) {
      if (ev.originalEvent && ev.originalEvent._pinHandled) return;
      const center = map.getCenter();
      state.session.mapView = { lat: center.lat, lng: center.lng, zoom: map.getZoom() };
      openModal({
        name: 'pin',
        draft: {
          lat: Math.round(ev.latlng.lat * 1e6) / 1e6,
          lng: Math.round(ev.latlng.lng * 1e6) / 1e6,
          severity: 'critical',
          titleOriginal: state.lang,
          detailOriginal: state.lang
        }
      });
    });
  }
  setTimeout(function () { if (campusMap === map) map.invalidateSize(); }, 80);
}
function render() {
  try {
    if (!state.session.skipModalCapture) captureModalDraft();
    state.session.skipModalCapture = false;
    captureLoginDraft();
    const loggedIn = !!state.user;
    document.getElementById('loginView').classList.toggle('hidden', loggedIn);
    document.getElementById('appView').classList.toggle('on', loggedIn);
    document.getElementById('tabbar').classList.toggle('on', loggedIn);
    document.getElementById('fab').classList.toggle('hidden', !loggedIn);
    applyLangChrome();
    if (!loggedIn) renderLogin();
    else {
      renderChrome();
      renderView();
    }
    renderModal();
    renderAlarmOverlay(state.user ? pendingAlarms() : []);
    mountCampusMap();
  } catch (err) {
    console.error(err);
    const view = document.getElementById('viewScroll');
    if (view) view.textContent = err && err.message ? err.message : 'Render error';
  }
}

function boot() {
  loadPref();
  loadData();
  loadSession();
  if (state.user && state.user.role === 'student') {
    const parsed = parseRoom(state.user.room);
    if (parsed) {
      state.user.room = parsed.canonical;
      state.user.building = parsed.building;
      state.user.floor = parsed.floor;
    } else if (state.user.id === 'stu-demo') {
      state.user.room = '1-109';
      state.user.building = '1';
      state.user.floor = 1;
    }
    const phone = parsePhone(state.user.phone, false);
    if (phone && phone.phone) state.user.phone = phone.phone;
    else if (state.user.id === 'stu-demo') state.user.phone = '0812345678';
    else state.user.phone = '';
    saveSession();
  }
  primeArrivals();
  document.body.addEventListener('click', onClick);
  document.body.addEventListener('submit', function (e) {
    if (e.target && e.target.closest && e.target.closest('form')) {
      e.preventDefault();
      onSubmit(e);
    }
  });
  document.body.addEventListener('pointerdown', function () { ensureAudio(); });
  document.body.addEventListener('input', function (e) {
    const el = e.target;
    if (!el || !el.dataset) return;
    if (el.dataset.kind === 'phone') {
      const next = String(el.value || '').replace(/\D/g, '').slice(0, 10);
      if (el.value !== next) el.value = next;
    }
    if (el.dataset.kind === 'student') {
      const next = String(el.value || '').replace(/\D/g, '').slice(0, 8);
      if (el.value !== next) el.value = next;
    }
    if (el.dataset.kind === 'building' || el.dataset.kind === 'floorroom') {
      let next = String(el.value || '').replace(/\D/g, '').slice(0, el.dataset.kind === 'building' ? 2 : 4);
      if (el.dataset.kind === 'floorroom' && el.form) {
        const building = Number(String((el.form.querySelector('[data-kind="building"]') || {}).value || '').replace(/\D/g, ''));
        if (building >= 1 && building <= 8) next = next.slice(0, 3);
      }
      if (el.value !== next) el.value = next;
      const box = el.form && el.form.querySelector('.room-error');
      if (box && el.form) {
        const building = (el.form.querySelector('[data-kind="building"]') || {}).value || '';
        const floorRoom = (el.form.querySelector('[data-kind="floorroom"]') || {}).value || '';
        const msg = roomLiveError(building, floorRoom);
        box.textContent = msg;
        box.classList.toggle('hidden', !msg);
      }
    }
  });
  document.body.addEventListener('focusout', function (e) {
    const el = e.target;
    if (!el || !el.dataset || !el.form) return;
    if (el.dataset.kind !== 'building' && el.dataset.kind !== 'floorroom') return;
    const box = el.form.querySelector('.room-error');
    if (!box) return;
    const building = (el.form.querySelector('[data-kind="building"]') || {}).value || '';
    const floorRoom = (el.form.querySelector('[data-kind="floorroom"]') || {}).value || '';
    if (!building || !floorRoom) return;
    const msg = parseRoom(String(building).replace(/\D/g, '') + '-' + String(floorRoom).replace(/\D/g, '')) ? '' : roomError();
    box.textContent = msg;
    box.classList.toggle('hidden', !msg);
  });
  document.body.addEventListener('change', function (e) {
    const input = e.target;
    if (!input || input.name !== 'floor' || input.type !== 'checkbox' || !input.form) return;
    const boxes = input.form.querySelectorAll('input[name="floor"]');
    if (input.value === 'all' && input.checked) {
      boxes.forEach(function (box) { if (box !== input) box.checked = false; });
    } else if (input.checked) {
      boxes.forEach(function (box) { if (box.value === 'all') box.checked = false; });
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.session.modal) closeModal();
  });
  window.addEventListener('storage', function (ev) {
    if (ev.key !== DATA_KEY || !ev.newValue) return;
    syncFromStorage();
  });
  window.addEventListener('online', function () { if (db) schedulePush(); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') syncFromStorage();
    state.session.alarmSig = '';
    const pending = state.user ? pendingAlarms() : [];
    const sos = pending.filter(function (a) { return a.kind === 'sos'; })[0];
    if (document.visibilityState !== 'visible') {
      stopSiren();
      if (sos) notifyAdminSos(sos);
    }
    renderAlarmOverlay(pending);
  });
  setInterval(syncFromStorage, 1000);
  if (!state.local.setupSeen) state.session.modal = { name: 'setup' };
  render();
  loadWeather();
  if (state.local.firebaseConfig && state.local.setupSeen) connectFirebase(state.local.firebaseConfig, { silent: true });
  setInterval(tickClocks, 1000);
  setInterval(function () {
    const expired = purgeExpired(state.data);
    if (expired) { saveData(); schedulePush(); }
    scanAlarms();
    const quietView = state.session.view === 'home' || state.session.view === 'transit';
    if ((expired || quietView) && !isTyping() && !state.session.modal) {
      state.session.keepScroll = true;
      render();
    }
  }, 30000);
  if (state.user) scanAlarms();
}
boot();
</script>
